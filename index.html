<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#EEF0F5">
<title>잠시 주차중입니다</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇰🇷</text></svg>">
<style>
  :root{
    --bg:#EEF0F5; --card:#FFFFFF; --ink:#1E2230; --sub:#7A8094;
    --blue:#2F5BEA; --dark:#2A2E3A;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{margin:0}
  html{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
    min-height:100%; display:flex; padding:20px;
  }
  .card{
    width:100%; max-width:400px; margin:auto; background:var(--card);
    border-radius:28px; padding:22px 24px 34px; text-align:center;
    box-shadow:0 10px 30px rgba(40,50,90,.08);
  }
  .emblem{width:150px;height:auto;display:block;margin:16px auto 0;filter:drop-shadow(0 6px 10px rgba(20,30,70,.18))}
  .flag{transform-box:fill-box;transform-origin:left center;animation:wave 3.2s ease-in-out infinite}
  @keyframes wave{0%,100%{transform:skewY(0)}50%{transform:skewY(-1.5deg)}}
  @media (prefers-reduced-motion:reduce){.flag{animation:none}}
  h1{font-size:28px; font-weight:800; margin:14px 0 10px; letter-spacing:-.02em}
  .lead{font-size:16px; line-height:1.6; color:var(--sub); margin:0 0 30px}
  .actions{display:flex; justify-content:center; gap:44px}
  .act{display:flex; flex-direction:column; align-items:center; gap:10px;
       text-decoration:none; color:var(--ink); font-size:15px; font-weight:700;
       -webkit-tap-highlight-color:transparent}
  .circle{width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;
          box-shadow:0 6px 16px rgba(30,40,80,.22)}
  .circle svg{width:32px;height:32px}
  .call .circle{background:var(--blue)}
  .sms .circle{background:var(--dark)}
  .circle{transition:transform .12s ease}
  .act:active .circle{transform:scale(.94)}
  .act:focus-visible{outline:none}
  .act:focus-visible .circle{outline:3px solid #FFC83D; outline-offset:4px}
</style>
</head>
<body>
<main class="card">

  <!-- 태극기 방패 문양 (자체 제작) -->
  <svg class="emblem" viewBox="0 0 200 236" role="img" aria-label="태극기 방패 문양">
    <defs>
      <clipPath id="inner"><path d="M14 14H186V118C186 172 150 204 100 222C50 204 14 172 14 118Z"/></clipPath>
      <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="M6 6H194V120C194 178 155 214 100 232C45 214 6 178 6 120Z" fill="#fff" stroke="#e3e6ee" stroke-width="2"/>
    <g clip-path="url(#inner)">
      <rect x="0" y="0" width="200" height="100" fill="#fff"/>
      <rect x="0" y="100" width="100" height="140" fill="#0047A0"/>
      <rect x="100" y="100" width="100" height="140" fill="#CD2E3A"/>
      <rect x="86" y="100" width="28" height="140" fill="#0A143C"/>
      <rect x="0" y="97" width="200" height="4" fill="#111"/>
      <rect x="0" y="100" width="200" height="140" fill="url(#gloss)"/>
    </g>
    <g class="flag">
      <rect x="40" y="18" width="120" height="80.00" fill="#fff" stroke="#d5d8e0" stroke-width="1"/>
      <g transform="translate(100.00 58.00) rotate(33.690)"><circle r="20.000" fill="#0047A0"/><path d="M-20.000 0A20.000 20.000 0 0 1 20.000 0Z" fill="#CD2E3A"/><circle cx="-10.000" r="10.000" fill="#CD2E3A"/><circle cx="10.000" r="10.000" fill="#0047A0"/></g>
      <polygon points="69.49,49.68 80.59,33.04 77.81,31.19 66.72,47.83" fill="#000"/>
      <polygon points="65.33,46.91 76.43,30.26 73.65,28.42 62.56,45.06" fill="#000"/>
      <polygon points="61.17,44.13 72.26,27.49 69.49,25.64 58.40,42.28" fill="#000"/>
      <polygon points="130.51,66.32 125.42,73.95 128.20,75.80 133.28,68.17" fill="#000"/>
      <polygon points="124.50,75.33 119.41,82.96 122.19,84.81 127.27,77.18" fill="#000"/>
      <polygon points="134.67,69.09 129.58,76.72 132.36,78.57 137.44,70.94" fill="#000"/>
      <polygon points="128.66,78.11 123.57,85.74 126.35,87.58 131.43,79.96" fill="#000"/>
      <polygon points="138.83,71.87 133.74,79.49 136.52,81.34 141.60,73.72" fill="#000"/>
      <polygon points="132.82,80.88 127.74,88.51 130.51,90.36 135.59,82.73" fill="#000"/>
      <polygon points="119.41,33.04 124.50,40.67 127.27,38.82 122.19,31.19" fill="#000"/>
      <polygon points="125.42,42.05 130.51,49.68 133.28,47.83 128.20,40.20" fill="#000"/>
      <polygon points="123.57,30.26 134.67,46.91 137.44,45.06 126.35,28.42" fill="#000"/>
      <polygon points="127.74,27.49 132.82,35.12 135.59,33.27 130.51,25.64" fill="#000"/>
      <polygon points="133.74,36.51 138.83,44.13 141.60,42.28 136.52,34.66" fill="#000"/>
      <polygon points="80.59,82.96 69.49,66.32 66.72,68.17 77.81,84.81" fill="#000"/>
      <polygon points="76.43,85.74 71.34,78.11 68.57,79.96 73.65,87.58" fill="#000"/>
      <polygon points="70.42,76.72 65.33,69.09 62.56,70.94 67.64,78.57" fill="#000"/>
      <polygon points="72.26,88.51 61.17,71.87 58.40,73.72 69.49,90.36" fill="#000"/>
    </g>
    <text x="100" y="168" text-anchor="middle" font-size="22" font-weight="900" fill="#fff" font-family="sans-serif" letter-spacing="1">PARKING</text>
  </svg>

  <h1>잠시 주차중입니다</h1>
  <p class="lead">연락이 필요할 경우<br>전화 또는 문자 부탁드립니다.</p>

  <div class="actions">
    <a class="act call" id="callBtn" href="tel:01054937615">
      <span class="circle"><svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg></span>
      전화연결
    </a>
    <a class="act sms" id="smsBtn" href="sms:01054937615?body=%EC%95%88%EB%85%95%ED%95%98%EC%84%B8%EC%9A%94">
      <span class="circle"><svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 3C6.5 3 2 6.6 2 11c0 2.5 1.4 4.7 3.6 6.2L5 21l4-2.2c1 .2 2 .3 3 .3 5.5 0 10-3.6 10-8.1S17.5 3 12 3zM7.5 12.3a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6zm4.5 0a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6zm4.5 0a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6z"/></svg></span>
      문자전송
    </a>
  </div>
</main>

<script>
  // 번호는 화면에 표시하지 않고, 누를 때만 연결합니다.
  var p = ['010','5493','7615'].join('');
  var msg = '안녕하세요';
  var ua = navigator.userAgent;
  var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  document.getElementById('callBtn').href = 'tel:' + p;
  document.getElementById('smsBtn').href = 'sms:' + p + (ios ? '&' : '?') + 'body=' + encodeURIComponent(msg);
</script>

</body>
</html>
